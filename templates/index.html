<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №3 — Gemini API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4 text-center">Лаб 3</h2>
    
    <div class="card shadow-sm p-4 mb-4">
        <form method="POST" id="labForm">
            <div class="mb-3">
                <label for="preset" class="form-label fw-bold">1. Оберіть тип завдання / приклад:</label>
                <select name="preset" id="preset" class="form-select" onchange="updatePrompt()">
                    {% for key in presets.keys() %}
                        <option value="{{ key }}" {% if key == selected_preset %}selected{% endif %}>{{ key }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label fw-bold">2. Системна роль:</label>
                <select name="role" id="role" class="form-select">
                    {% for key in roles.keys() %}
                        <option value="{{ key }}" {% if key == selected_role %}selected{% endif %}>{{ key }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="prompt" class="form-label fw-bold">3. Текст промпта:</label>
                <textarea name="prompt" id="prompt" class="form-control" rows="5" required>{{ prompt }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Надіслати запит до Gemini API</button>
        </form>
    </div>

    {% if result %}
    <div class="card shadow-sm p-4">
        <h4 class="card-title">Відповідь моделі:</h4>
        <pre class="bg-white p-3 border rounded text-wrap" style="white-space: pre-wrap;">{{ result }}</pre>
    </div>
    {% endif %}
</div>

<script>
    const presets = {{ presets | tojson }};
    function updatePrompt() {
        const selected = document.getElementById('preset').value;
        if (selected in presets) {
            document.getElementById('prompt').value = presets[selected];
        }
    }
</script>
</body>
</html>
